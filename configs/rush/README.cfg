// How Rush finds a map's stages (this file itself is never loaded).
// First match wins; a map with none of them plays normally.
//
// 1. Rush points in the map (recommended for map makers)
//
//    Name control points <prefix>[<stage>_]<name> in the map's conquest layer
//    (prefix: rush.prefix, default Rush_):
//
//      Rush_1_EastOpenBase    stage 1
//      Rush_1_Bridge          stage 1
//      Rush_2_Factory         stage 2
//      Rush_2_Church          stage 2
//      Rush_3_AxisHQ          stage 3
//
//    - Stages are played in number order (gaps are fine). Points without a
//      number (Rush_Depot) come after them, rush.pointsPerStage to a stage,
//      nearest to the attackers first.
//    - Give the Rush points to the defending team in the editor; the other
//      team attacks. (If they're neutral or split, rush.attackers decides.)
//    - The attackers need a point of their own that isn't a Rush point (their
//      main base) to spawn at before the first stage.
//    - Players are told the name without the prefix and number ("EastOpenBase").
//    - On rounds that aren't Rush (another mode, rush.maps, rush.enabled 0)
//      the Rush points are made neutral and locked, so the same map also plays
//      as ordinary conquest (rush.hidePoints). They still show as neutral flags.
//
// 2. Stage files, for maps you can't or don't want to edit:
//    rmm/configs/rush/maps/<map>.cfg, e.g. maps/el_alamein.cfg.
//
//   attackers <1|2>        the attacking team (default: rush.attackers)
//   tickets <n>            attacker tickets per stage (default: rush.tickets)
//   time <seconds>         time per stage, 0 = no limit (default: rush.stageTime)
//   stage <point> [<point> ...] [tickets=<n>] [time=<seconds>]
//                          one stage, played top to bottom; the attackers must
//                          capture every point of it
//
//   Point names are the control point templates the map uses. On a running
//   server "rmm cps" lists them with their owners and positions.
//   At round start every stage point is given to the defenders. Points that
//   are in no stage (the main bases) keep their owner and are locked.
//
//   Example:
//
//     attackers 2
//     tickets 40
//     time 480
//     stage VillageCP BridgeCP
//     stage FactoryCP ChurchCP tickets=60
//     stage AxisHQ time=600
//
// 3. Automatic stages (rush.auto 1): every control point that isn't a main
//    base, nearest to the attackers' base first, rush.pointsPerStage to a stage.
