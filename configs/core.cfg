// Executed once when RMM starts, before plugins load. Lines are run through
// the RMM console: RMM commands, RMM variables, otherwise engine commands.
//
// To preset a variable of a plugin that has not loaded yet, use
//   rmm var <name> <value>

rmm.chatTrigger "!"
rmm.silentTrigger "/"
rmm.logLevel 1
rmm.replyFallback 1

