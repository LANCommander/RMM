// Classic gun game: infantry only, every main weapon in BF1942, then
// grenades, both pistols and the knife. Works on every map (kits aren't tied
// to a map). Format and options: see default.cfg; weapon names:
// docs/BF1942_WEAPONS.md.
//
// Engineer kits carry no grenades, which makes them the best carriers for the
// pistol and knife levels. The Scout keeps its grenades for the grenade level.

// Machine guns
kit      Us_Assault          name=BAR              weapons=Bar1918
kit      German_Assault      name=StG_44           weapons=Sg44
kit      Rus_Assault         name=DP-28            weapons=DP
kit      Jap_Assault         name=Type_99          weapons=Type99
kit      Canadian_Assault    name=Johnson_LMG      weapons=JohnsonLMG

// SMGs
kit      US_Medic            name=Thompson         weapons=Thompson
kit      German_Medic        name=MP_40            weapons=Mp40
kit      Rus_Medic           name=SMG              weapons=Mp18

// Rifles
kit      USMarine_Engineer   name=M1_Garand        weapons=M1Garand
kit      Jap_Engineer        name=Type_5_rifle     weapons=Type5
kit      German_Engineer     name=Kar98k           weapons=K98
kit      GB_Engineer         name=Lee-Enfield      weapons=No4

// Rockets: splash kills count too (same weapon)
kit      US_AT               name=Bazooka          weapons=Bazooka
kit      German_AT           name=Panzerschreck    weapons=Panzershreck

// Snipers
kit      GB_Scout            name=No.4_sniper      weapons=No4Sniper
kit      German_Scout        name=Kar98k_sniper    weapons=K98Sniper

// Finale
kit      US_Scout            name=Grenades         weapons=Grenade*
kit      US_Engineer         name=Colt             weapons=Colt
kit      German_Engineer     name=Walther_P38      weapons=WalterP38
kit      German_Engineer     name=Knife            weapons=Knife*
