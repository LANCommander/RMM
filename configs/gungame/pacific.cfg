// Pacific gun game: US Marine and Japanese weapons, with the Pacific maps'
// armour. Format and options: see default.cfg; names and seats:
// docs/BF1942_WEAPONS.md.
//
// guadalcanal, iwo_jima, midway, wake: M3A1, Chi-Ha, Sherman
// invasion_of_the_philippines: also the Ho-Ha
// coral_sea: M3A1 only (the rest is ships and planes)

kit      UsMarine_Assault    name=BAR               weapons=Bar1918
kit      Jap_Assault         name=Type_99           weapons=Type99
kit      USMarine_Medic      name=Thompson          weapons=Thompson
kit      Jap_Medic           name=SMG               weapons=Mp18
vehicle  M3A1                name=M3_half-track     seat=1    kit=USMarine_Medic
kit      USMarine_Engineer   name=M1_Garand         weapons=M1Garand
kit      Jap_Engineer        name=Type_5_rifle      weapons=Type5
vehicle  Ho-Ha               name=Ho-Ha_half-track  seat=1    kit=Jap_Medic
vehicle  Chi-ha              name=Chi-Ha            kills=2   kit=Jap_AT
vehicle  Sherman             name=Sherman           kills=2   kit=USMarine_AT
kit      USMarine_AT         name=Bazooka           weapons=Bazooka
kit      Jap_Scout           name=Sniper_rifle      weapons=K98Sniper
kit      USMarine_Engineer   name=Colt              weapons=Colt
kit      Jap_Engineer        name=Knife             weapons=Knife*
