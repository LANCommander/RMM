// Armour gun game for the European and North African maps: a short infantry
// start, half-track MGs, then the tanks, from light to heavy. Format and
// options: see default.cfg; names and seats: docs/BF1942_WEAPONS.md.
//
// Each map plays the tanks it has; the others are skipped:
//   Western/desert (aberdeen, battleaxe, bulge, bocage, el_alamein, gazala,
//   market_garden, omaha_beach, tobruk): M10, Sherman, Panzer IV, Tiger
//   Eastern (berlin, kharkov, kursk, stalingrad): T-34, Panzer IV, T-34/85, Tiger
//   liberation_of_caen: Sherman, Panzer IV
// battle_of_britain and the Pacific maps have no tanks from this list; use
// default, classic or pacific there (or a gungame/maps/<map>.cfg).
//
// Tanks need two or three kills; killed inside, the tank explodes
// (gungame.vehicleExplode) and the player gets the same tank back when they
// respawn.

kit      US_Medic            name=Thompson          weapons=Thompson
kit      German_Assault      name=StG_44            weapons=Sg44
vehicle  M3A1                name=M3_half-track     seat=1    kit=US_Medic
vehicle  Hanomag             name=Hanomag_half-track seat=1   kit=German_Medic
kit      US_AT               name=Bazooka           weapons=Bazooka
vehicle  M10                 name=M10               kills=2   kit=US_AT
vehicle  Sherman             name=Sherman           kills=2   kit=US_Engineer
vehicle  T34                 name=T-34              kills=2   kit=Rus_Engineer
vehicle  PanzerIV            name=Panzer_IV         kills=2   kit=German_AT
vehicle  T34-85              name=T-34/85           kills=2   kit=Rus_AT
vehicle  Tiger               name=Tiger             kills=3   kit=German_Engineer
kit      German_AT           name=Panzerschreck     weapons=Panzershreck
kit      German_Engineer     name=Knife             weapons=Knife*
