// Gun Game ladder: one level per line, played top to bottom. Reorder, add or
// remove lines freely; "gg reload" (admin) applies changes mid-round.
// Pick a ladder with gungame.ladder <file name> (configs/plugins/gungame.cfg).
// Ladders shipped: default (this, mixed), classic (infantry only),
// armour (tanks, European maps), pacific (Pacific maps).
//
//   kit     <kit template>      [kills=N] [name=Shown_Name] [weapons=<globs>]
//   vehicle <vehicle template>  [kills=N] [name=Shown_Name] [kit=<kit template>]
//                               [seat=N] [exit=0|1] [height=metres] [weapons=<globs>]
//
//   kills   kills needed to finish this level (default: gungame.killsPerLevel)
//   weapons only kills with these weapons count (comma-separated globs, e.g.
//           weapons=Bazooka,Panzershreck). A kit always comes with a pistol,
//           a knife and grenades or engineer tools; with weapons= set those
//           still kill but don't count. Without it, any kill with the kit
//           counts. Knife kills count on every level (gungame.knifeCounts).
//           Off entirely with gungame.strictWeapons 0.
//           Names: docs/BF1942_WEAPONS.md. A kill reports the hand weapon
//           (Bar1918, Colt, GrenadeAllies, KnifeAxis); from a vehicle it
//           reports the vehicle (T34), whichever of its guns fired. So on
//           vehicle levels weapons= can't pick a gun, and isn't needed: only
//           kills from the player's own vehicle count there.
//   name    what players are told ("_" becomes a space; default: the template)
//   kit     vehicle levels: also give this kit, for when the player is on foot
//   seat    vehicle levels: seat to put the player in (0 = driver, -1 = first
//           free). Tank drivers fire the cannon; on half-tracks the gun is
//           seat 1 (the driver can't shoot).
//   exit    vehicle levels: override gungame.vehicleExit for this level only
//   height  vehicle levels: spawn height above the terrain (default 1)
//
// Template names are the engine's: "rmm find <pattern>" lists what a map
// contains, "rmm objects" its vehicles. Levels whose template the current map
// hasn't loaded are skipped (the log says which), so one ladder can serve maps
// with different vehicles. A ladder only for one map goes in
// gungame/maps/<map name>.cfg (e.g. maps/kursk.cfg) and wins over the
// gungame.ladder one.
//
// This ladder: most European maps have the Hanomag and Panzer IV; Sherman is
// on the Western and North African maps, T-34 on the Eastern ones (berlin,
// kharkov, kursk, stalingrad), so each map gets one or the other.

kit      Us_Assault         name=BAR             weapons=Bar1918
kit      German_Assault     name=StG_44          weapons=Sg44
kit      Rus_Assault        name=DP-28           weapons=DP
kit      US_Medic           name=Thompson        weapons=Thompson
vehicle  Hanomag            name=Half-track_MG   seat=1    kit=German_Medic
kit      German_Medic       name=MP_40           weapons=Mp40
kit      German_Engineer    name=Kar98k          weapons=K98
vehicle  PanzerIV           name=Panzer_IV       kills=2   kit=German_AT
kit      US_AT              name=Bazooka         weapons=Bazooka
vehicle  Sherman            name=Sherman         kills=2   kit=US_AT
vehicle  T34                name=T-34            kills=2   kit=Rus_Assault
kit      German_Scout       name=Sniper_rifle    weapons=K98Sniper
kit      US_Engineer        name=Colt_pistol     weapons=Colt
kit      German_Engineer    name=Knife           weapons=Knife*
