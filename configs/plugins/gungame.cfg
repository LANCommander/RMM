// Executed right after the gungame plugin loads (and on every reload).
// The ladder itself lives in rmm/configs/gungame/<gungame.ladder>.cfg.
// (Comments must be on their own lines.)

gungame.enabled 1
gungame.ladder default
gungame.killsPerLevel 1

// Knife kills: the victim loses this many levels (0 = off). Weapon template
// names that count as a knife, as globs (BF1942: KnifeAllies, KnifeAxis;
// Road to Rome bayonets K98Bayonet, No4Bayonet; Secret Weapons EliteKnife,
// CommandoKnife. Full list: docs/BF1942_WEAPONS.md).
gungame.knifeDemote 1
gungame.knifeWeapons "*knife*,*bayonet*"
// knifeCounts: a knife kill also counts towards the killer's level, on any level
gungame.knifeCounts 1
// strictWeapons: only kills with the level's weapon count (a level's weapons=;
// on vehicle levels, kills from the player's own vehicle). 0 = any kill counts.
gungame.strictWeapons 1
// lockWeapons: on kit levels with weapons=, players can't switch to the kit's
// other weapons (the knife stays while knifeCounts is on) and get the level's
// weapon in hand. Experimental on BF1942: the client view can snap back.
gungame.lockWeapons 0
gungame.suicideDemote 0
gungame.teamKills 0

// Vehicle levels: the vehicle spawns at the nearest of the map's own vehicle
// spawn points (they are out in the open), else next to the player, who is
// put in it. spotRange: metres to look for such a point (0 = always next to
// the player); spawnDistance: metres from the player otherwise.
gungame.spotRange 300
// vehicleExit: may they get out with the use key? (a level's exit= overrides it)
gungame.vehicleExit 0
// vehicleSwitch: may they change seats (F1-F8) inside it?
gungame.vehicleSwitch 1
// vehicleReenter: having got out, may they get back in?
gungame.vehicleReenter 1
// otherVehicles: may anyone use map vehicles, stationary guns or others' vehicles?
gungame.otherVehicles 0
// vehicleExplode: killed inside it, the vehicle explodes
gungame.vehicleExplode 1
// vehicleRespawn: seconds until an owner who survived it gets a new one (-1 = never)
gungame.vehicleRespawn 5
gungame.spawnDistance 6
// stuckCooldown: seconds between two "!gg stuck" (a fresh vehicle)
gungame.stuckCooldown 30

// mapVehicles: the map's own vehicles and stationary guns spawn (0 = they
// don't; those already there go once empty)
gungame.mapVehicles 0
// respawnTime: seconds until a dead player may spawn again, spawn waves off
// (-1 = the server's game.serverSpawnTime/serverSpawnDelay). The server's own
// timing comes back when gun game stops.
gungame.respawnTime 0

// pickups: picking up kits from the ground
gungame.pickups 0
// endRound: the winner ends the round (0 = announce, everyone starts over)
gungame.endRound 1
// levelScore: scoreboard score = level
gungame.levelScore 1
// holdTickets: tickets never run out
gungame.holdTickets 1
