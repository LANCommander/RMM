// Executed right after the rush plugin loads (and on every reload).
// (Comments must be on their own lines.)
//
// Where a map's stages come from, first match wins:
//   1. control points in the map named <rush.prefix>[<stage>_]<name>,
//      e.g. Rush_1_EastOpenBase, Rush_1_Bridge, Rush_2_Factory
//      (format: rmm/configs/rush/README.cfg);
//   2. a stage file, rmm/configs/rush/maps/<map>.cfg;
//   3. with rush.auto 1, stages made from the map's ordinary control points.
// A map with none of them plays normally.
//
// Rush and gun game don't mix: while gungame.enabled is 1, Rush stays idle.
// Set the server's own round time (game.serverGameTime) to 0 or longer than
// all stages together: when it runs out the engine ends the round itself.

rush.enabled 1
rush.prefix "Rush_"

// Rotations: Rush only runs in these game modes, on these maps (globs). Every
// other round (CTF, a map left out here...) plays normally. BF1942: GPM_CQ.
rush.modes "*cq*,*conquest*"
rush.maps "*"

// Rounds that aren't Rush: make the map's Rush points neutral and lock them,
// so conquest on a Rush map plays as designed. They still show as neutral flags.
rush.hidePoints 1

// Maps with no Rush points and no stage file: 1 = make stages from their
// control points (every point that isn't a main base, nearest to the
// attackers first), 0 = play them normally.
rush.auto 0
rush.pointsPerStage 2

// Attacking team when the map doesn't decide it (Rush points owned by one team
// in the editor: the other team attacks): 1, 2, or 0 = the team that holds
// fewer control points when the round starts. BF1942: team 1 is the Axis
// (Japan on Pacific maps), team 2 the Allies.
rush.attackers 0

// Attacker tickets per stage (one per attacker death; refilled for every new
// stage), and seconds per stage (0 = no limit). Stage files can override both.
rush.tickets 50
rush.stageTime 600

// The defenders' ticket counter shows the seconds left in the stage.
rush.clockTickets 1
