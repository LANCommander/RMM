// Executed right after the voicechat plugin loads (and on every reload).
// (Comments must be on their own lines.)
//
// The voice server (the LANCommander Interposer's) is built into the plugin.
// Players need the Battlefield 1942 patch with voice chat; it finds the voice
// port in the server's query replies (\commsport\), so open this UDP port too.
// Port, address, password and limits apply when the voice server starts:
// after changing them, run "voiceadmin restart".

voicechat.enabled 1
voicechat.port 27800
voicechat.bindAddress ""

// Clients must also give this password (their voiceChat.password); empty = none.
voicechat.password ""
// Key for the voice server's remote admin channel; empty = off.
voicechat.adminKey ""

voicechat.maxPlayers 256
voicechat.maxBitrate 32000

// Nearby voice: full volume within proximityFullVolumeRange metres, silent
// beyond proximityRange. These apply at once.
voicechat.proximityRange 50
voicechat.proximityFullVolumeRange 4

// Seconds between two position/team updates sent to the voice server.
voicechat.updateInterval 0.1

// Register bots as voice players too (only useful for testing).
voicechat.includeBots 0
