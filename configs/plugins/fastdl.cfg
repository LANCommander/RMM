// Executed right after the fastdl plugin loads (and on every reload).
// (Comments must be on their own lines.)
//
// Tells patched clients where to download this server's maps and mods: the
// query replies get \fastdlport\, \fastdlhost\ and \fastdlpath\. Clients
// download http://<host>:<port><path>/<file> from any web server that serves
// the game folder's layout (this plugin doesn't serve files itself).

// Port of the download server; 0 = don't advertise one.
fastdl.port 0
// Its host name or address; empty = this game server's address.
fastdl.host ""
// URL path of the game files, e.g. /bf1942; empty = the root.
fastdl.path ""
