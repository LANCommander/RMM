// Refractor MultiMod admins.
//
// <kind> <identity> <flags> [immunity] [comment]
//
//   kind      auth  - BF2/BF2142 profile id (numeric), BF1942/BFV CD-key hash  (recommended)
//             ip    - IP address without port
//             name  - player name (can be spoofed! only for LAN/testing)
//   flags     a reservation  b generic  c kick  d ban  e unban  f slay/team
//             g changemap    h config   i chat  j vote k password
//             l rcon         m cheats   n plugins   z root (everything)
//   immunity  admins can only target players with immunity <= their own
//
// Server console and TCP RCon always have full access.

// auth  "12345678"     z      100  "Server owner"
// auth  "87654321"     bcdfgi 50   "Moderator"
// ip    "192.0.2.10"   b      0    "LAN box"
