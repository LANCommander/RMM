# Builds a release when a semver tag (v1.2.3, or v1.2.3-rc.1 for a pre-release) is pushed.
# Each platform gets a core zip plus one zip per bundled plugin; all are attached to a GitHub release.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag against the source version
        id: check
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "$tag" =~ $semver ]]; then
            echo "::error::Tag '$tag' is not a semver tag (vMAJOR.MINOR.PATCH[-pre][+build])"
            exit 1
          fi

          version="${tag#v}"
          base="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          cmake_ver=$(sed -nE 's/^project\(RefractorMultiMod VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          core_ver=$(sed -nE 's/^#define RMM_VERSION_STRING "([^"]+)".*/\1/p' src/core/core.h)
          if [[ "$cmake_ver" != "$base" || "$core_ver" != "$base" ]]; then
            echo "::error::Tag $tag does not match the source (CMakeLists.txt: $cmake_ver, core.h: $core_ver)"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          [[ -n "${BASH_REMATCH[4]}" ]] && pre=true || pre=false
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86
          # An older image keeps librmm.so's glibc requirement low for older server distros.
          - os: ubuntu-22.04
            platform: linux-x86
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install 32-bit toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-multilib ninja-build

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A Win32

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32
          -DCMAKE_SHARED_LINKER_FLAGS=-m32 -DCMAKE_EXE_LINKER_FLAGS=-m32

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: >
          python -I tools/package_release.py --dist build/dist
          --version ${{ needs.version.outputs.version }}
          --platform ${{ matrix.platform }} --out release

      - uses: actions/upload-artifact@v4
        with:
          name: rmm-${{ needs.version.outputs.version }}-${{ matrix.platform }}
          path: release/*.zip
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=()
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
          gh release create "$TAG" release/*.zip release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "RMM $TAG" --generate-notes --verify-tag "${flags[@]}"
