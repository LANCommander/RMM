; Refractor MultiMod gamedata - Battlefield 2 (Refractor 2, server 1.5x)
;
; Everything that differs between games/patches/mods and can be expressed as
; data lives here, so supporting a new patch or a total-conversion mod (e.g.
; Project Reality) means editing this file, not recompiling RMM.
;
; Values marked VERIFY are best-known names that have not yet been confirmed
; against a running server. Remove the marker once tested.

[game]
name = Battlefield 2
default_mod = bf2
default_size = 64

[python]
module_windows = dice_py.dll
module_linux = libdice_py.so            ; [bin] bf2 lists it as NEEDED and imports Py_Initialize from it

; Console command templates used by AdapterBase.
;   {id} {team} {index} {minutes} {score} {tickets} {size} {x} {y} {z}  verbatim
;   {msg} {reason} {map} {mode} {name}                                  quoted
; Several commands may be chained with " ; ".
; change_map / tickets / kill / team / score / teleport are implemented by the
; Python bridge on BF2 and do not need templates.
[commands]
kick           = admin.kickPlayer {id}
ban            = admin.banPlayer {id} perm          ; VERIFY argument syntax (perm/round/seconds)
say_all        = game.sayAll {msg}
say_team       = game.sayTeam {team} {msg}           ; VERIFY
restart_map    = admin.restartMap
run_next_map   = admin.runNextLevel
maplist_list   = maplist.list
maplist_append = maplist.append {map} {mode} {size}
maplist_clear  = maplist.clear
set_next_map   = admin.nextLevel {index}

[capabilities]
; Force capabilities on/off where template presence is misleading.
private_message = 0      ; BF2 has no server->single player message command
center_message  = 0

; Portable settings -> engine variables (rmm_setting).
[settings]
server_name     = sv.serverName
password        = sv.password
max_players     = sv.maxPlayers
time_limit      = sv.timeLimit
score_limit     = sv.scoreLimit
ticket_ratio    = sv.ticketRatio
rounds_per_map  = sv.roundsPerMap
spawn_time      = sv.spawnTime
man_down_time   = sv.manDownTime
friendly_fire   = sv.soldierFriendlyFire
vehicle_ff      = sv.vehicleFriendlyFire
team_ratio      = sv.teamRatioPercent
autobalance     = sv.autoBalanceTeam
bot_count       = sv.coopBotCount
bot_ratio       = sv.coopBotRatio
bot_skill       = sv.coopBotDifficulty
welcome_message = sv.welcomeMessage
voip_enabled    = sv.voipEnabled
punkbuster      = sv.punkBuster
allow_nose_cam  = sv.allowNoseCam
external_views  = sv.allowExternalViews
kick_tk_count   = sv.tkNumPunishToKick                 ; VERIFY
; gravity       = physics.gravity                      ; VERIFY - not confirmed as a runtime server var
; game_speed    =                                      ; no known equivalent

; Optional native hooks for what the Python API cannot do. Linux server
; 1.5.3153.0: bin/ia-32/bf2 and bin/amd-64/bf2 both ship their full .symtab,
; so functions are resolved by mangled name (identical in both builds).
; Evidence: docs/re/bf2-linux.md. Set native = 0 to run bridge-only.
[linux]
native = 1
; void GameLogicDamage::serverGiveDamage(IObject*, float, IPlayer*, list*, IObject*, int,
;      IObject*, IObject*, Vec3, Vec3, int, bool, bool, bool, bool)  - final damage, static
server_give_damage = _ZN4dice3hfe5world15GameLogicDamage16serverGiveDamageEPNS1_7IObjectEfPNS1_7IPlayerEPSt4listINS0_7WeakPtrIS5_EESaIS9_EES4_iS4_S4_NS0_4Vec3ESD_ibbbb
; IPlayerManager* dice::hfe::world::playerManager (+ vtable to validate it)
player_manager = _ZN4dice3hfe5world13playerManagerE
playermanager_vtable = _ZTVN4dice3hfe5world13PlayerManagerE
; IObject* getRootParent(const IObject*)
get_root_parent = _ZN4dice3hfe5world13getRootParentEPKNS1_7IObjectE
; highest player id probed when listing vehicle occupants
max_player_id = 255

; Virtual slot INDICES (byte offset = index * pointer size), same in both builds.
[linux_slots]
iobject_query_interface = 3        ; IBase::queryInterface(unsigned)
pco_get_player = 4                 ; IPlayerControlObject -> IPlayer* (ServerGameLogic::giveDamage)
template_get_name = 11             ; ObjectTemplate::getName() const
player_get_vehicle = 18            ; Player vtable +0x48
player_get_id = 21                 ; Player vtable +0x54 (== Python Player.index)
player_get_is_alive = 27           ; Player vtable +0x6c
player_get_default_vehicle = 41    ; Player vtable +0xa4 (the soldier)
player_get_team = 58               ; Player vtable +0xe8
playermanager_get_player_from_id = 8   ; PlayerManager vtable +0x20

; Field offsets, per build.
[linux_offsets]
object_template = 0x14             ; ia-32: Object::Object(const IObjectTemplate*) stores it at this+0x14
[linux64_offsets]
object_template = 0x28             ; amd-64: Object::Object stores it at this+0x28

[signatures]
