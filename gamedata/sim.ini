; Gamedata for rmm_simhost's simulated server. Commands map onto the fake
; console implemented in src/games/sim/sim_adapter.cpp.

[game]
name = Simulator
default_mod = sim
default_size = 32

[commands]
kick           = sim.kick {id} {reason}
ban            = sim.ban {id} {minutes} {reason}
kill           = sim.kill {id}
set_team       = sim.setTeam {id} {team}
pm             = sim.pm {id} {msg}
set_score      = sim.setScore {id} {score}
teleport       = sim.teleport {id} {x} {y} {z}
change_map     = sim.changeMap {map} {mode} {size}
restart_map    = sim.restartMap
run_next_map   = sim.runNextMap
maplist_list   = sim.maplist
maplist_append = sim.maplistAppend {map} {mode} {size}
maplist_clear  = sim.maplistClear
set_next_map   = sim.setNextMap {index}
say_all        = sim.say {msg}
say_team       = sim.sayTeam {team} {msg}
center         = sim.center {msg}
get_tickets    = sim.tickets {team}
set_tickets    = sim.setTickets {team} {tickets}

; Bots: a fake AI console with BF1942's command names and output formats
; (the AI runs on maps whose mode contains "coop"). See gamedata/bf1942.ini.
bot_count         = simai.getBotCount
bot_list          = simai.getAllBots
bot_position      = simai.getBotPosition {bot}
bot_goal          = simai.getBotGoalPosition {bot}
bot_team          = simai.getBotSide {bot}
bot_kit           = simai.getBotKit {bot}
bot_vehicle       = simai.getBotVehicle {bot}
bot_behaviour     = simai.getActiveBehaviour {bot}
bot_behaviours    = simai.getBotBehaviourList {bot}
bot_add_player    = simai.createAIPlayer {botname} {team} {kit}
bot_add_player_at = simai.createAIPlayer {botname} {team} {kit} {pos}
bot_add           = simai.addBot {botname} {team} {moral} {personality} NoEquipment
; sim-only: BF1942 has no working remove command (ai.killBotId only slays)
bot_remove        = simai.removeBot {bot}
bot_remove_all    = simai.removeAllBots
bot_move          = simai.botMoveTo {radius} {pos} {bot}
bot_patrol        = simai.botSetWaypoints_Patrol {bot} {radius} {count} {p1} {p2}
bot_order         = simai.botGiveOrder {bot} {behaviour} {modifiers}
bot_strategy      = simai.getActiveStrategy {team}
bot_strategies    = simai.listSAIStrategies {team}
bot_set_strategy  = simai.forceStrategy {strategy} {team}
bot_skill         = simai.getBotSkill
bot_set_skill     = simai.setBotSkill {skill}

[bots]
default_kit         = KTAssault
default_personality = StandardWeights
default_modifiers   = StandardWeights
moral               = default
no_vehicle          = NoVehicle
add_attempts        = 8
move_radius         = 5
patrol_points       = 2

; BF2-style names so plugins see realistic variables.
[settings]
server_name     = sv.serverName
password        = sv.password
max_players     = sv.maxPlayers
time_limit      = sv.timeLimit
score_limit     = sv.scoreLimit
ticket_ratio    = sv.ticketRatio
rounds_per_map  = sv.roundsPerMap
spawn_time      = sv.spawnTime
man_down_time   = sv.manDownTime
friendly_fire   = sv.soldierFriendlyFire
vehicle_ff      = sv.vehicleFriendlyFire
team_ratio      = sv.teamRatioPercent
autobalance     = sv.autoBalanceTeam
gravity         = physics.gravity
game_speed      = sim.gameSpeed
bot_count       = sv.coopBotCount
bot_ratio       = sv.coopBotRatio
bot_skill       = sv.coopBotDifficulty
welcome_message = sv.welcomeMessage
voip_enabled    = sv.voipEnabled
punkbuster      = sv.punkBuster
allow_nose_cam  = sv.allowNoseCam
external_views  = sv.allowExternalViews
kick_tk_count   = sv.tkNumPunishToKick

[sim_defaults]
server_name     = RMM Test Server
max_players     = 64
time_limit      = 1800
ticket_ratio    = 100
spawn_time      = 15
friendly_fire   = 100
gravity         = -14.73
game_speed      = 1.0
bot_count       = 0
bot_skill       = 50
welcome_message = Welcome to the RMM simulator
