; Refractor MultiMod gamedata - Battlefield Vietnam (Refractor 1.5, server 1.21)
;
; Linux server: bfv_linded.dynamic (i386, unstripped, GCC 3 ABI - same as
; bf1942_lnxded). Most mangled names are identical to BF1942 1.61; the struct
; layouts are NOT. Every offset below was read from the BFV binary's own code
; (objdump of the named functions); see docs/re/bf1942-linux.md
; for what each key means. Keys omitted here would fall back to the BF1942
; defaults in r1_native.cpp, so a hook is only enabled once everything it
; reads is verified for BFV.

[game]
name = Battlefield Vietnam
default_mod = bfvietnam
auth_timeout = 20

[linux]
enabled = 1
; ---- core (identical names; OldConsole vtable identical: executeLine +0x8, output +0x10)
console_execute   = _ZN4dice4ref22io10OldConsole11executeLineERKSsRSsbbbbb
server_frame      = _ZN4dice2bf5Setup13updateConsoleEv
main_console      = _ZN4dice4ref22io11mainConsoleE
oldconsole_vtable = _ZTVN4dice4ref22io10OldConsoleE
console_output    = _ZN4dice4ref22io10OldConsole6outputERKSs

; ---- players (PlayerManager::getPlayers = this+0x0c, as BF1942)
player_manager    = _ZN4dice4ref25world13playerManagerE
bfplayer_vtable   = _ZTVN4dice2bf8BFPlayerE
get_player_ip     = _ZNK4dice2bf10GameServer18getPlayerIPAndPortEi
; BFV prints the octets reversed (client 10.0.1.192 came back as "192.1.0.10:50088")
player_ip_reversed = 1
destroy_player    = _ZN4dice2bf10GameServer13destroyPlayerEPNS0_8BFPlayerE
kill_player       = _ZN4dice2bf10GameServer10killPlayerEi

; ---- chat: ChatMessage layout identical to BF1942 (checked in GameServer::say)
chat              = _ZN4dice2bf10GameServer17handleChatMessageERKNS0_11ChatMessageE
say               = _ZN4dice2bf10GameServer3sayEiRKSsbb
say_client        = _ZN4dice2bf10GameServer9sayClientEiSsbb

; ---- auth
cdkey_auth        = _ZN4dice2bf22cdKeyAuthorizeCallbackEiiiPcPv
gcd_getkeyhash    = gcd_getkeyhash

; ---- game status. BFV has no gameStatusFirstPlaying: round start = first
; frame of the per-frame gameStatusPlaying(float).
status_pregame       = _ZN4dice2bf10GameServer17gameStatusPreGameEf
status_playing       = _ZN4dice2bf10GameServer17gameStatusPlayingEf
status_first_endgame = _ZN4dice2bf10GameServer22gameStatusFirstEndGameEv

; ---- map: Setup* global. setCurrentLevel(const campaign_desc_t&) stores the level
; name at setup+0x208, the GamePlayMode at +0x250 (and +0x1dc) and the mod at +0x36c.
setup             = _ZN4dice2bf5setupE
; gpmToString's switch: 1 CTF, 2 CQ, 3 TDM, 4 COOP, 5 CCOMBAT, 6 EVOL (anything else -> CQ)
gpm_names         = ,GPM_CTF,GPM_CQ,GPM_TDM,GPM_COOP,GPM_CCOMBAT,GPM_EVOL

; ---- ping: NetServer* at GameServer+0x1e8, getPing at vtable +0x94 (updateConnections)
netserver_vtable  = _ZTVN4dice4ref22io9NetServerE

; ---- spawn: same prototype as BF1942; success sets player+0x89. The kit comes
; from the per-team kit maps below.
spawn             = _ZN4dice2bf10GameServer11spawnPlayerEPNS0_8BFPlayerE

; ---- flag captures: ControlPoint::setTeam(unsigned) - team +0x1b0, template +0x1a0
cp_set_team       = _ZN4dice4ref25world12ControlPoint7setTeamEj

; ---- kills / score: handleScore has the BF1942 prototype and ScoreMsg values
; (0 FlagCapture .. 3 Kill, 4 Death, 5 DeathNoMsg, 6 TK, 7 Spawned - from its
; event-log switch). Weapon names: objectTemplateManager->getTemplate(id), +0x60.
score            = _ZN4dice2bf10GameServer11handleScoreEPNS0_8BFPlayerENS_4ref25world8ScoreMsgES3_ii
template_manager = _ZN4dice4ref25world21objectTemplateManagerE

; ---- vehicles. BFV has no ICompositeObject: IObject+0x50 is the parent, and
; enterVehicle/exitVehicle/_giveDamage find the IPlayerControlObject with
; __dynamic_cast(obj, &typeid(IObject), &typeid(IPlayerControlObject), -2).
object_parent_direct = 1
object_typeinfo  = _ZTIN4dice4ref25world7IObjectE
pco_typeinfo     = _ZTIN4dice4ref25world20IPlayerControlObjectE
enter_vehicle    = _ZN4dice2bf10GameServer12enterVehicleEPNS0_8BFPlayerEPNS_4ref25world7IObjectEbb
exit_vehicle     = _ZN4dice2bf10GameServer11exitVehicleEPNS0_8BFPlayerEb
get_root_parent  = _ZN4dice4ref25world13getRootParentEPKNS1_7IObjectE

; ---- damage: same argument list as BF1942 with Vec3 in place of Pos3 (3 floats
; by value). Weapon id is the 5th argument (getTemplate + handleScore use it).
give_damage      = _ZN4dice2bf10GameServer11_giveDamageEPNS_4ref25world7IObjectEfiiiNS2_4Vec3Eibbb

; ---- NOT YET ENABLED for BFV (needs RE first)
; object_manager / physics / soldier_template_cid : layouts unverified (world objects, push)

[linux_offsets]
vtable_address_point = 8
; BFV interface vtables begin with both destructors (BF1942's do not), so
; virtual slots shift by +8. Object vtable: queryComponent +0x28 and
; getAbsolutePosition +0x38 happen to be unchanged; queryInterface is +0x10.
object_template          = 0x4c   ; Object::Object(const IObjectTemplate*) stores it here (as BF1942)
vt_template_get_class_id = 0x14   ; ObjectTemplate vtable (BF1942 0x0c)
vt_template_get_name     = 0x1c   ; ObjectTemplate vtable (BF1942 0x14)
vt_template_manager_get_template = 0x60   ; getTemplate(unsigned) (BF1942 0x50)
vt_object_query_interface = 0x10  ; (BF1942 0x08)
object_parent            = 0x50   ; IObject -> parent (enterVehicle's loop)
vt_pco_id                = 0x34   ; IPlayerControlObject, logged as "pco_id" (BF1942 0x2c)
; Armor vtable (dumped): getMaxHitPoints 0x1c, getHitPoints 0x24, isDestroyed 0xd0
vt_armor_max_hit_points  = 0x1c
vt_armor_hit_points      = 0x24
vt_armor_is_destroyed    = 0xd0
playermanager_list   = 0x0c   ; PlayerManager::getPlayers
player_name          = 0x48   ; BFPlayer::getName        (BF1942 0x44)
player_vehicle       = 0x50   ; BFPlayer::getVehicle     (0x4c)
player_id            = 0x60   ; BFPlayer::getId          (0x58)
player_soldier       = 0x70   ; BFPlayer::setDefaultVehicle (0x68)
player_is_ai         = 0x88   ; BFPlayer::getIsAIPlayer  (0x78)
player_alive         = 0x89   ; GameServer::spawnPlayer sets it to 1 (0x79)
player_team          = 0x8c   ; BFPlayer::setTeam        (0x7c)
player_deaths        = 0xb4   ; ScoreManager::scoreEvent / resetStats (0xa0)
player_kills         = 0xb8   ; (0xa4)
player_score         = 0xcc   ; score accumulator in scoreEvent (0xc0)
; ping (GameServer::updateConnections)
gameserver_netserver  = 0x1e8  ; BF1942 0x18c
vt_netserver_get_ping = 0x94   ; BF1942 0x8c
; kits: Game::getKits(team) = +0x5c for team 1, +0x50 otherwise; std::map<int,string>,
; key team*256+kit (Game::setKit). GameServer::changeKit stores the kit byte at player+0x94.
gameserver_kit_map_team1 = 0x5c
gameserver_kit_map_team2 = 0x50
player_kit_index      = 0x94   ; BF1942 0x80
; map (Setup::setCurrentLevel)
setup_current_level   = 0x208  ; std::string level name
setup_current_gpm     = 0x250  ; GamePlayMode
setup_current_mod     = 0x36c  ; std::string mod
; control points (ControlPoint::setTeam, ::handleUpdate)
cp_team               = 0x1b0  ; BF1942 0x174
cp_template           = 0x1a0  ; BF1942 0x164
cp_template_radius    = 0x1b8  ; float, compared with the distance (BF1942 0x1dc)
chat_kind            = 0x00
chat_text            = 0x04
chat_text_capacity   = 64
chat_length          = 0x48
chat_sender          = 0x4c
chat_server_flag     = 0x50

[commands]
kick           = admin.kickPlayer {id}                  ; VERIFY
ban            = admin.banPlayer {id}                   ; VERIFY
say_all        = game.sayAll {msg}                      ; VERIFY
change_map     = admin.changeMap {map} {mode} {mod}     ; VERIFY
restart_map    = admin.restartMap                       ; VERIFY
run_next_map   = admin.runNextLevel                     ; VERIFY
maplist_append = game.addLevel {map} {mode} {mod}       ; format from mods/bfvietnam/settings/maplist.con
maplist_list   = game.listMaps                          ; VERIFY

; Bots: BFV has BF1942's AI console (every method name below is in
; bfv_linded.dynamic). Copied from bf1942.ini - VERIFY all of them live, in a
; co-op round (see bf1942.ini for formats and the getAllBots-outside-co-op crash).
bot_count         = ai.getBotCount
bot_list          = ai.getAllBots
bot_position      = ai.getBotPosition {bot}
bot_goal          = ai.getBotGoalPosition {bot}
bot_team          = ai.getBotSide {bot}
bot_kit           = ai.getBotKit {bot}
bot_vehicle       = ai.getBotVehicle {bot}
bot_behaviour     = ai.getActiveBehaviour {bot}
bot_behaviours    = ai.getBotBehaviourList {bot}
bot_add_player    = game.createAIPlayer {botname} {team} {kit}
bot_add_player_at = game.createAIPlayer {botname} {team} {kit} {pos}
bot_add           = ai.addBot {botname} {team} {moral} {personality} NoEquipment
; no bot_remove: ai.killBotId only slays on BF1942 (see bf1942.ini)
bot_move          = ai.botMoveTo {radius} {pos} {bot}
bot_patrol        = ai.botSetWaypoints_Patrol {bot} {radius} {count} {p1} {p2}
bot_order         = ai.botGiveOrder {bot} {behaviour} {modifiers}
bot_strategy      = ai.getActiveStrategy {team}
bot_strategies    = ai.listSAIStrategies {team}
bot_set_strategy  = aiStrategy.forceStrategy {strategy} {team}
bot_skill         = aiSettings.getBotSkill
bot_set_skill     = aiSettings.setBotSkill {skill}

[capabilities]
private_message = 0
bot_add = 0          ; as on BF1942 (strategic-AI hang after adding bots); opt in only for testing

[bots]
default_kit         = KTAssault     ; KTScout KTAssault KTAT KTEngineer (+ *Alt variants), from the binary
default_personality = StandardWeights   ; VERIFY (BF1942 name)
default_modifiers   = StandardWeights   ; VERIFY
moral               = default
no_vehicle          = NoVehicle
add_attempts        = 8
move_radius         = 5
patrol_points       = 2

; All game.server* names below appear verbatim in bfv_linded.dynamic.
[settings]
server_name     = game.serverName
password        = game.serverPassword
max_players     = game.serverMaxPlayers
time_limit      = game.serverGameTime
score_limit     = game.serverScoreLimit
ticket_ratio    = game.serverTicketRatio
rounds_per_map  = game.serverNumberOfRounds
spawn_time      = game.serverSpawnTime
friendly_fire   = game.serverSoldierFriendlyFire
vehicle_ff      = game.serverVehicleFriendlyFire
team_ratio      = game.serverAlliedTeamRatio            ; also game.serverAxisTeamRatio
bot_skill       = game.serverCoopAiSkill
punkbuster      = game.serverPunkBuster

[signatures]
verified          = 0

[offsets]
