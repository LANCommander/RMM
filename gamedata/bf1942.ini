[linux_offsets]
playermanager_list   = 0x0c   ; PlayerManager::getPlayers() returns this+0x0c (std::list<IPlayer*>)
player_name          = 0x44   ; BFPlayer::getName() -> this+0x44 (std::string)
player_vehicle       = 0x4c   ; BFPlayer::getVehicle()
player_id            = 0x58   ; BFPlayer::getId()
player_soldier       = 0x68   ; BFPlayer::setDefaultVehicle()
player_is_ai         = 0x78   ; BFPlayer::getIsAIPlayer() (bool)
player_alive         = 0x79   ; bool, set to 1 by a successful spawnPlayer()
player_team          = 0x7c   ; BFPlayer::setTeam()
player_default_camera = 0x74  ; BFPlayer::setDefaultCamera(); destroyed by AIPlayer::removePlayerFromGame
gameserver_player_count = 0x18 ; players; co-op refills bots while this < +0x1c (setMaxNrOfPlayers)
botmanager_pid_table = 0x38   ; BotManager: std::vector<int> player id -> bot id (-1 = none), getBotFromPlayerId
; ref2::io::PlayerInput (Input<PlayerInputMap,55>): float value[55], uint64 mapped mask at +0xdc
; (PlayerAction::set, Input::isInputMapped); GameServer copies 0x3b dwords per input.
playerinput_slots    = 55
playerinput_mask     = 0xdc
playerinput_size     = 0xec
object_template      = 0x4c   ; IObject -> IObjectTemplate* (template->getName() is vtable +0x14)
; BFPlayer stats (ScoreManager::scoreEvent). A parallel set sits at +0xf4..+0x114;
; VERIFY live which of the two resets per round.
player_deaths        = 0xa0
player_kills         = 0xa4
player_score         = 0xc0
gameserver_netserver = 0x18c  ; NetServer*; getPing(int id, int* out) is vtable +0x8c
player_kit_index     = 0x80   ; set by GameServer::changeKit(); replicated (updateStateMask bit 0x800000)
player_score_total   = 0x114  ; second score counter ScoreManager::scoreEvent moves with player_score
soldier_kit_id       = 0x408  ; BFSoldier::getKitId(): id of the carried kit object, -1 = none
soldier_item_ids     = 0x3ac  ; BFSoldier: int* item object id per slot (-1 = empty), see enableItem
soldier_active_item  = 0x3b8  ; BFSoldier: held slot, -1 = none (replicated: BFSoldierNetworkable bit 0x100)
soldiertemplate_item_slots = 0x2d4 ; soldier template: number of item slots (enableItem's range check)
objectspawner_timer  = 0x120  ; float seconds until the next spawn (calcSpawnDelay, handleFrameUpdate)
objectspawner_team   = 0x134  ; team whose template the spawner uses (spawnObject's map lookup)
gameserver_spawn_waves = 0x201     ; bool: dead players wait for the next wave (killPlayer)
gameserver_spawn_delay = 0x204     ; float: seconds a dead player waits when waves are off
gameserver_spawn_wave_time = 0x214 ; float: seconds between waves (game.serverSpawnTime)
teamscore_tickets    = 0x48   ; TeamScore tickets (ScoreManager::getTeamScore(team), gameStatusPlaying)
gamestatus_endgame   = 2      ; GameStatus passed to setGameStatus when a round is won
gameserver_kit_map   = 0x4c   ; std::map<int, std::string> team*256+kit -> kit template name (Game::setKit)
cp_team              = 0x174  ; ControlPoint team (0 = neutral)
cp_template          = 0x164  ; ControlPointTemplate*
cp_template_radius   = 0x1dc  ; float capture radius (ControlPoint::handleFrameUpdate)
cp_lose_timer        = 0x168  ; float: losingControl counts it down (template lose time)
cp_take_timer        = 0x16c  ; float: gettingControl counts it down (template take time)
cp_taking_team       = 0x170  ; team raising a neutral point (gettingControl)
cp_state             = 0x17c  ; 1 lost, 2 losing, 3 getting, 4 controlled
cp_template_take_time = 0x1f4 ; float
cp_template_lose_time = 0x1f8 ; float
cp_template_fixed    = 0x200  ; byte: unableToChangeTeam (setTeam is a no-op when 1)
cp_template_only_team = 0x214 ; int: onlyTakeableByTeam, 0 = any
vtable_address_point = 8      ; GCC 3 vptr = &vtable[2]
setup_current_level  = 0x23c  ; Setup::getCurrentLevel(): CampaignEntry {string level; int gpm @+4; string mod @+8}
object_id            = 0x48   ; IObject id: key of ObjectManager's maps (registerObject, addPco)
objectmanager_objects = 0x94  ; std::map<unsigned, IObject*> of registered objects
objectmanager_pco_map = 0x11c ; std::map<unsigned, IObject*> of player-control objects (getPcoMap)
objectmanager_grid    = 0x48  ; std::map<unsigned, IObject*> of root objects (getAllObjectsFromGrid / getObjectFromGrid)
objectmanager_grid_nocollision = 0x60 ; same, for objects with flag 0x200 (getObjectFromNoCollisionGrid)
object_networkable    = 0x68  ; IObject -> networkable; 0 = never sent to clients (createObjectOnAllClients)
vt_terrain_get_height = 0x44  ; PatchTerrain::getHeight(float x, float z) const -> float
; ChatMessage (handleChatMessage + the one GameServer::say() builds)
chat_kind            = 0x00   ; int: 0 = team, 1 = global
chat_text            = 0x04   ; char[68]; say() writes at most 63 chars
chat_text_capacity   = 64
chat_length          = 0x48   ; text length (must match text)
chat_sender          = 0x4c   ; player id, -1 = server
chat_server_flag     = 0x50   ; bool: server message

; Console command templates.
[commands]
kick           = admin.kickPlayer {id}                 ; [bin] kickPlayer grouped with admin.* ; VERIFY prefix
ban            = admin.banPlayer {id}                  ; [bin] banPlayer ; VERIFY prefix
say_all        = game.sayAll {msg}                     ; [bin] sayAll grouped with game commands ; VERIFY prefix
change_map     = admin.changeMap {map} {mode} {mod}    ; [bin] GameServer::changeMap(map, mode, mod) ; VERIFY prefix
restart_map    = admin.restartMap                      ; [bin] restartMap ; VERIFY prefix
run_next_map   = admin.runNextLevel                    ; [bin] runNextLevel ; VERIFY prefix
maplist_append = game.addLevel {map} {mode} {mod}      ; [bin] "game.addLevel %s %s %s"
maplist_list   = game.listMaps                         ; [bin] listMaps ; VERIFY prefix + output format
; Found in the binary but owning console object unknown - enable once confirmed:
;   killPlayer, setTeam, serverMessage, setNextLevel. There is no sayTeam.

; Bots: the engine's AI console (ai.*, aiSettings.*, aiStrategy.*).
; All verified on a live server, Berlin GPM_COOP (docs/re/bf1942-linux.md "AI bots").
; The AI only exists in co-op. bot_count is the probe: outside co-op it prints
; "Unknown object or method" - but ai.getAllBots (bot_list) SEGFAULTS the server
; there, so RMM only sends the others after bot_count answered with a number.
; {bot} = AI bot id (0..n-1, from bot_list "<id> <name>"); bot players are ids 255 down.
bot_count         = ai.getBotCount                       ; "32" (includes removed-but-kept bots)
bot_list          = ai.getAllBots                        ; "<id> <name>" per line. Linux reads the list natively
                                                         ; instead: this segfaults once a removed bot's brain is detached.
bot_position      = ai.getBotPosition {bot}              ; "x/y/z"
bot_goal          = ai.getBotGoalPosition {bot}          ; "x/y/z"
bot_team          = ai.getBotSide {bot}                  ; "1"
bot_kit           = ai.getBotKit {bot}                   ; "KTAssault"
bot_vehicle       = ai.getBotVehicle {bot}               ; "NoVehicle" on foot
bot_behaviour     = ai.getActiveBehaviour {bot}          ; index into bot_behaviours
bot_behaviours    = ai.getBotBehaviourList {bot}         ; "0 Avoid", "1 MoveTo", "2 Idle", "3 Fire", ...
; Adding is two console calls a frame apart (the engine's own ai/spawnSoldier.con recipe):
; createAIPlayer makes the player, ai.addBot attaches an AI brain (prints the bot id, or -1).
bot_add_player    = game.createAIPlayer {botname} {team} {kit}
bot_add_player_at = game.createAIPlayer {botname} {team} {kit} {pos}
bot_add           = ai.addBot {botname} {team} {moral} {personality} NoEquipment
; Removing: no console command does it (ai.killBotId only slays, admin.kickPlayer ignores
; bots). RMM detaches the AI with bot_deactivate (AIMain::deactivateBot(int player id) ->
; BotManager pool + SAI), then runs the engine's own teardown natively (Linux: exit_vehicle,
; destroy_object on player_default_camera, destroy_player). See docs/re "AI bots".
bot_deactivate    = ai.deactivateBot {player}
bot_move         = ai.botMoveTo {radius} {pos} {bot}    ; AIConsole::botMoveTo(float, Pos3, int)
bot_patrol        = ai.botSetWaypoints_Patrol {bot} {radius} {count} {p1} {p2}
bot_order         = ai.botGiveOrder {bot} {behaviour} {modifiers}
bot_strategy      = ai.getActiveStrategy {team}          ; "finalPush"
bot_strategies    = ai.listSAIStrategies {team}          ; "0 west", "1 east", ...
bot_set_strategy  = aiStrategy.forceStrategy {strategy} {team}
bot_skill         = aiSettings.getBotSkill               ; "0.75" (game.serverCoopAiSkill / 100 at round start)
bot_set_skill     = aiSettings.setBotSkill {skill}
; NOT exposed: ai.saiEnable - switching the strategic AI back on at runtime segfaulted the server.

[capabilities]
private_message = 0
; ai.addBot works, but a bot added after another was removed (its slot reused) later hung
; the server inside SAI::distributeResources. Opt in only for testing.
bot_add = 0

[bots]
default_kit         = KTAssault     ; KTScout KTAssault KTAT KTMedic KTEngineer
default_personality = StandardWeights
default_modifiers   = StandardWeights
moral               = default
no_vehicle          = NoVehicle
add_attempts        = 8             ; ai.addBot retries, 0.25 s apart
move_radius         = 5
patrol_points       = 2             ; the console form takes two points
; Co-op tops the server up with bots again after a removal. 1 = RMM keeps removed bots'
; slots empty until the round ends; 0 = let the engine refill them (a new bot appears).
keep_removed        = 1
remove_wait         = 5             ; living bots are killed first (the engine only detaches dead ones);
                                    ; give up if one is still alive after this many seconds

; Portable settings. All game.server* names below appear verbatim in the
; binary's settings writer unless marked.
[settings]
server_name     = game.serverName                       ; [bin] serverName ; VERIFY prefix
password        = game.serverPassword                   ; [bin] serverPassword ; VERIFY prefix
max_players     = game.serverMaxPlayers
time_limit      = game.serverGameTime
score_limit     = game.serverScoreLimit
ticket_ratio    = game.serverTicketRatio
rounds_per_map  = game.serverNumberOfRounds
spawn_time      = game.serverSpawnTime
friendly_fire   = game.serverSoldierFriendlyFire
vehicle_ff      = game.serverVehicleFriendlyFire
team_ratio      = game.serverAlliedTeamRatio            ; also game.serverAxisTeamRatio
autobalance     = game.serverAutoBalanceTeams
bot_skill       = game.serverCoopAiSkill
punkbuster      = game.serverPunkBuster
allow_nose_cam  = game.serverAllowNoseCam
external_views  = game.serverExternalViews
gravity         = physics.gravity                       ; [bin] gravity among physics props ; VERIFY prefix
; welcome_message = game.serverWelcomeMessage           ; not found in the settings writer

; Windows server (BF1942_w32ded.exe 1.61, VC++ 7.0, no symbols). Absolute
; addresses for exactly this build: RMM refuses any other executable
; (pe_timestamp / pe_image_size). Every entry was matched against the named
; Linux function in Ghidra; see docs/re/bf1942-windows.md. Same keys and
; meanings as [linux]; a key left out turns its feature off.
[windows]
enabled         = 1
build           = 1.61 BF1942_w32ded.exe (2004-01-22)
pe_timestamp    = 0x400faa42
