; Refractor MultiMod gamedata - Battlefield 1942 (Refractor 1, server 1.61)
;
; Evidence for every entry is in docs/re/bf1942-linux.md. Notation:
;   [bin]    name confirmed to exist in the server binary (strings/symbols)
;   VERIFY   object prefix or argument syntax still needs a live server test

[game]
name = Battlefield 1942
default_mod = bf1942
; Seconds to wait for the GameSpy CD-key callback before authenticating a
; player without a CD-key hash (it may never come on LAN servers). 0 = wait forever.
auth_timeout = 20

; Linux server (bf1942_lnxded.dynamic, GCC 3.2.3, i386, non-PIE).
; Functions/globals are resolved by mangled name from the executable's
; .symtab, so these keys survive rebuilds that keep symbols.
[linux]
enabled = 1
; void io::OldConsole::executeLine(const std::string&, std::string&, bool x5)  [required]
;   Every console line (scripts, server console, remote admin) goes through it
;   (io::Console vtable +0x8). console::Parser / LocalConsole are never called
;   by the 1.61 server.
console_execute = _ZN4dice4ref22io10OldConsole11executeLineERKSsRSsbbbbb
; Setup::updateConsole() - called every main-loop iteration                  [required: frame]
server_frame    = _ZN4dice2bf5Setup13updateConsoleEv
; IPlayerManager* dice::ref2::world::playerManager                           [players]
player_manager  = _ZN4dice4ref25world13playerManagerE
; vtable for dice::bf::BFPlayer (used to validate player pointers)
bfplayer_vtable = _ZTVN4dice2bf8BFPlayerE

; void GameServer::handleChatMessage(const ChatMessage&) - blockable/mutable chat
chat            = _ZN4dice2bf10GameServer17handleChatMessageERKNS0_11ChatMessageE
; void cdKeyAuthorizeCallback(int gameid, int localid, int ok, char*, void* gameServer) [file-local]
cdkey_auth      = _ZN4dice2bf22cdKeyAuthorizeCallbackEiiiPcPv
; const char* gcd_getkeyhash(int gameid, int localid)  (GameSpy SDK, C linkage)
gcd_getkeyhash  = gcd_getkeyhash
; void GameServer::say(int id, const std::string&, bool teamOnly, bool)
say             = _ZN4dice2bf10GameServer3sayEiRKSsbb
; void GameServer::sayClient(int id, std::string, bool, bool) - private message
say_client      = _ZN4dice2bf10GameServer9sayClientEiSsbb
; std::string GameServer::getPlayerIPAndPort(int) const
get_player_ip   = _ZNK4dice2bf10GameServer18getPlayerIPAndPortEi

; int GameServer::spawnPlayer(BFPlayer*)  - success sets player+0x79
spawn           = _ZN4dice2bf10GameServer11spawnPlayerEPNS0_8BFPlayerE
; int GameServer::enterVehicle(BFPlayer*, IPlayerObject*, bool isDefault, bool isFake)
enter_vehicle   = _ZN4dice2bf10GameServer12enterVehicleEPNS0_8BFPlayerEPNS_4ref25world13IPlayerObjectEbb
; int GameServer::exitVehicle(BFPlayer*, bool isFake)
exit_vehicle    = _ZN4dice2bf10GameServer11exitVehicleEPNS0_8BFPlayerEb
; void GameServer::handleScore(BFPlayer*, ScoreMsg, BFPlayer* victim, int weaponTemplateId, int)
score           = _ZN4dice2bf10GameServer11handleScoreEPNS0_8BFPlayerENS_4ref25world8ScoreMsgES3_ii
; IObjectTemplateManager* (weapon template id -> name)
template_manager = _ZN4dice4ref25world21objectTemplateManagerE
; void ControlPoint::setTeam(unsigned)  - called by gotControl(team) / lostControl() (team 0)
cp_set_team     = _ZN4dice4ref25world12ControlPoint7setTeamEj
; void ControlPoint::gotControl(int team) / lostControl(int): called directly by set_control_point
; (setTeam reports the change, so these two are not hooked on Linux)
cp_got_control  = _ZN4dice4ref25world12ControlPoint10gotControlEi
cp_lost_control = _ZN4dice4ref25world12ControlPoint11lostControlEi
; void ControlPoint::handleFrameUpdate(float) - all capture logic; skipped for locked points
cp_frame_update = _ZN4dice4ref25world12ControlPoint17handleFrameUpdateEf
; .rodata constant 0x94a5: ObjectTemplate::getClassID() of control points
cp_template_cid = _ZN4dice4ref25world24CID_ControlPointTemplateE
; vtable for dice::ref2::io::NetServer (validates GameServer+0x18c before calling getPing)
netserver_vtable = _ZTVN4dice4ref22io9NetServerE
; io::Console* mainConsole - an OldConsole; executeLine +0x8, output(const std::string&) +0x10   [required]
main_console    = _ZN4dice4ref22io11mainConsoleE
oldconsole_vtable = _ZTVN4dice4ref22io10OldConsoleE
; void io::OldConsole::output(const std::string&) - executeLine prints results through it;
; detoured to capture engine command output during RMM's own Exec
console_output  = _ZN4dice4ref22io10OldConsole6outputERKSs
; int GameServer::destroyPlayer(BFPlayer*) - slot freed (drops the CD-key hash)
destroy_player  = _ZN4dice2bf10GameServer13destroyPlayerEPNS0_8BFPlayerE

; Map / round / status. Setup* dice::bf::setup; current level = setup+0x23c (CampaignEntry)
setup           = _ZN4dice2bf5setupE
