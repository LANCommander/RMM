; .rodata constant 0x9493: ObjectTemplate::getClassID() (vtable +0xc) of soldiers
soldier_template_cid = _ZN4dice4ref25world21CID_BFSoldierTemplateE

; Object creation - see docs/re/bf1942-linux.md "Runtime object creation"
; const IObjectTemplate* ObjectTemplateManager::getTemplate(const std::string&) const (case-insensitive)
template_by_name = _ZNK4dice4ref25world21ObjectTemplateManager11getTemplateERKSs
; IObject* GameServer::createObjectOnAllClients(const IObjectTemplate*, Pos3, Vec3, bool, int)
create_object_on_all_clients = _ZN4dice2bf10GameServer24createObjectOnAllClientsEPKNS_4ref25world15IObjectTemplateENS2_4Pos3ENS2_4Vec3Ebi
; bool GameServer::destroyObject(IObject*) - also tells every client
destroy_object  = _ZN4dice2bf10GameServer13destroyObjectEPNS_4ref25world7IObjectE
; BaseMatrix4<float>& setRotation<float>(BaseMatrix4<float>&, const Vec3&) - yaw/pitch/roll in degrees
matrix_set_rotation = _ZN4dice4ref211setRotationIfEERNS0_11BaseMatrix4IT_EES5_RKNS0_11BaseVector3IS3_NS0_13VectorTraits3IS3_EEEE
; void world::setTransformation(IObject*, const Mat4&)
set_transformation = _ZN4dice4ref25world17setTransformationEPNS1_7IObjectERKNS0_4Mat4E
; geom::ITerrain* geom::terrainBase; only trusted when it is a PatchTerrain (NullTerrain = no map)
terrain         = _ZN4dice4ref24geom11terrainBaseE
patchterrain_vtable = _ZTVN4dice4ref24geom12PatchTerrainE
; void ai::AIPlayer::addInput(PlayerInput*) - every bot input tick (bots->set_input/get_input)
ai_add_input    = _ZN4dice2bf2ai8AIPlayer8addInputEPNS_4ref22io11PlayerInputE
