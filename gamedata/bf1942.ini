bot_main_reset     = _ZN4dice2bf2ai7BotMain5resetEv
; ai::IBotManager* ai::IBotManager::instance (BotManager); the bot list is read natively from it
bot_manager     = _ZN4dice2bf2ai11IBotManager8instanceE

